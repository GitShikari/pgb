name: Watcho Promo Checker

on:
  workflow_dispatch:  # run manually from Actions tab

jobs:
  check-promos:
    runs-on: ubuntu-latest

    steps:
      - name: Install requests
        run: pip install requests

      - name: Run promo checker
        run: |
          python3 - << 'PYEOF'
          import requests
          import json
          import time

          # ── Config ──────────────────────────────────────────────────────────

          MOBILE_NO         = "7856810284"
          OTTSMSID          = 68676566
          PAYMENT_GATEWAY   = ""
          SUBSCRIPTION_PLAN = "PL735B90B4568125ED6C3F678819B6E058"
          AUTH_TOKEN        = (
              "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9."
              "eyJ1bmlxdWVfbmFtZSI6Ijc4NTY4MTAyODQiLCJuYmYiOjE3NzgyMjkwNDEsImV4cCI6"
              "MTg2NDYyOTA0MSwiaWF0IjoxNzc4MjI5MDQxLCJpc3MiOiJEaXNoT1RUIiwiYXVkIjoiRGlzaE9UVCJ9."
              "BhR5uY7wWlqnWOsLO8MO8nhbYrjGsRtHVQbVCI0_PqE"
          )

          START_CODE = "W4MM10225911"

          # ── Telegram ─────────────────────────────────────────────────────────

          TG_BOT_TOKEN = "8629736889:AAHZsgovnwDeDpG0Yu8BML5V9o9aQMYGOwY"
          TG_CHAT_ID   = "8024677797"

          def send_telegram(text: str):
              url = f"https://api.telegram.org/bot{TG_BOT_TOKEN}/sendMessage"
              try:
                  requests.post(url, json={"chat_id": TG_CHAT_ID, "text": text}, timeout=10)
              except Exception as e:
                  print(f"[TG ERROR] {e}")

          # ── Watcho API ───────────────────────────────────────────────────────

          WATCHO_URL = "https://planofferapi.watcho.com/api/PlanOffer/VaildatePromoCode"

          HEADERS = {
              "accept": "application/json, text/plain, */*",
              "accept-language": "en-US,en;q=0.9,en-IN;q=0.8",
              "apikey": "dIsH19Tv0724",
              "content-type": "application/json",
              "origin": "https://plan-offers.watcho.com",
              "priority": "u=1, i",
              "referer": "https://plan-offers.watcho.com/",
              "sec-ch-ua": '"Microsoft Edge";v="147", "Not.A/Brand";v="8", "Chromium";v="147"',
              "sec-ch-ua-mobile": "?0",
              "sec-ch-ua-platform": '"Windows"',
              "sec-fetch-dest": "empty",
              "sec-fetch-mode": "cors",
              "sec-fetch-site": "same-site",
              "user-agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/147.0.0.0 Safari/537.36 Edg/147.0.0.0"
              ),
          }

          def split_code(code):
              i = len(code) - 1
              while i >= 0 and code[i].isdigit():
                  i -= 1
              return code[:i + 1], int(code[i + 1:])

          def check_promo(promo_code):
              payload = {
                  "MobileNo": MOBILE_NO,
                  "OTTSMSID": OTTSMSID,
                  "PromoCode": promo_code,
                  "PaymentGateway": PAYMENT_GATEWAY,
                  "SubscriptionPlanCode": SUBSCRIPTION_PLAN,
                  "AuthToken": AUTH_TOKEN,
              }
              try:
                  resp = requests.post(WATCHO_URL, headers=HEADERS, json=payload, timeout=15)
                  resp.raise_for_status()
                  return resp.json()
              except requests.RequestException as e:
                  print(f"[ERROR] {e}")
                  return None

          # ── Main ─────────────────────────────────────────────────────────────

          prefix, number = split_code(START_CODE)
          found = []

          # GitHub Actions jobs have a 6-hour limit; run for up to 5.5 hours
          deadline = time.time() + 5.5 * 3600

          print(f"Starting from {START_CODE}\n")
          print(f"{'CODE':<20} {'STATUS':<10} MESSAGE")
          print("─" * 70)

          while time.time() < deadline:
              promo_code = f"{prefix}{number}"
              print(f"{promo_code:<20}", end=" ", flush=True)

              data = check_promo(promo_code)

              if data is None:
                  print(f"{'ERROR':<10} retrying in 3s...")
                  time.sleep(3)
                  continue

              status  = data.get("ResultStatus", "Unknown").strip()
              message = data.get("ResultMessage", "no message")

              if status.lower() == "success":
                  print(f"{'SUCCESS':<10} {message}")

                  result     = data.get("Result", {})
                  discount   = result.get("DiscountType", {})
                  validity   = result.get("SubscriptionValidityInDays", "?")
                  vendor     = result.get("VendorID", "?")

                  tg_msg = (
                      f"✅ Valid Watcho Promo Code Found!\n\n"
                      f"Code      : {promo_code}\n"
                      f"Vendor    : {vendor}\n"
                      f"Discount  : {discount.get('Value', '?')}% {discount.get('Type', '')}\n"
                      f"Validity  : {validity} days\n\n"
                      f"Message   : {message}"
                  )
                  send_telegram(tg_msg)
                  print(f"{'':20} └─ Telegram notification sent")
                  found.append(promo_code)
              else:
                  print(f"{status:<10} {message}")

              number += 1

          # ── Final summary via Telegram ────────────────────────────────────────

          if found:
              summary = f"🏁 Run complete.\n\nValid codes found ({len(found)}):\n" + "\n".join(found)
          else:
              summary = "🏁 Run complete. No valid promo codes found."

          send_telegram(summary)
          print("\n" + summary)
          PYEOF
